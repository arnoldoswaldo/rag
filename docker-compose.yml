# docker-compose.yml
services:                          

  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: unless-stopped        
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB:       rag_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d rag_db"]
      interval: 10s    
      timeout: 5s      
      retries: 5       
      start_period: 10s  
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  pgdata:
